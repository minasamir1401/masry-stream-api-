version: '3.8'

# Dokploy Optimized Docker Compose
# Designed to connect with Dokploy's Traefik reverse proxy (dokploy-network)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-masry_stream}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the workspace environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-masry_stream}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the workspace environment}@postgres:5432/${POSTGRES_DB:-masry_stream}}
      SQLITE_FALLBACK: "${SQLITE_FALLBACK:-false}"
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-0}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_SESSION_STRING: ${TELEGRAM_SESSION_STRING:-}
      TELEGRAM_AUTO_JOIN_SOURCES: ${TELEGRAM_AUTO_JOIN_SOURCES:-false}
      SECURITY_SIGNING_KEY: ${SECURITY_SIGNING_KEY:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_ORIGINS: ${ADMIN_ORIGINS:-["https://animeclover.click","http://localhost:3000","http://127.0.0.1:3000"]}
      ADMIN_SECURE_COOKIE: ${ADMIN_SECURE_COOKIE:-true}
      TELEGRAM_CHANNELS: ${TELEGRAM_CHANNELS:-["DisneyMasry"]}
      SCRAPE_INTERVAL_MINUTES: ${SCRAPE_INTERVAL_MINUTES:-60}
      SCRAPE_BATCH_LIMIT: ${SCRAPE_BATCH_LIMIT:-100}
      AUTO_SCRAPE_ON_STARTUP: ${AUTO_SCRAPE_ON_STARTUP:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-["*"]}
    volumes:
      - backend_cache:/app/cache
      - backend_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal_net
      - dokploy-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        INTERNAL_BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://animeclover.click}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      INTERNAL_BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://animeclover.click}
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal_net
      - dokploy-network

volumes:
  postgres_data:
  backend_cache:
  backend_data:

networks:
  internal_net:
    driver: bridge
  dokploy-network:
    external: true
